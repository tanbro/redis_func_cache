repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-added-large-files
      - id: check-symlinks
      - id: detect-private-key
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-ast
      - id: check-builtin-literals
      # - id: check-docstring-first

  # prettier is run via npx (local hook)
  - repo: local
    hooks:
      - id: luals
        name: lua-language static check
        language: system
        entry: lua-language-server --check=src/redis_func_cache/lua
        files: '\.lua$'
        pass_filenames: false
      - id: prettier
        name: prettier
        entry: npx --yes prettier
        language: system
        pass_filenames: true
        args: ["--write", "--ignore-unknown"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff # Run the linter.
        types_or: [python, pyi, jupyter]
        args: [--fix]
      - id: ruff-format # Run the formatter.
        types_or: [python, pyi, jupyter]

  # mypy runs through uv inside the project environment, so it sees exactly the
  # dependencies pinned in uv.lock — no shadow additional_dependencies to keep
  # in sync. uv is therefore a required host tool, like node and lua-language-server.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        language: system
        entry: uv run mypy
        types_or: [python, pyi]
        pass_filenames: false

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: "0.38.2"
    hooks:
      - id: check-github-workflows
      - id: check-readthedocs

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
        args: ["--fix"]
